<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arnés de push · dev</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: #F2F4F1; color: #17201B; }
    button { font: inherit; padding: 10px 16px; border-radius: 12px; border: 0; background: #1E5B4F; color: #fff; cursor: pointer; }
    textarea, input, select { font: inherit; width: 100%; box-sizing: border-box; margin: 6px 0 12px; padding: 8px; }
    pre { background: #fff; padding: 12px; border-radius: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Arnés de push (solo desarrollo)</h1>
  <label>person_id <input id="person" type="number" value="1"></label>
  <p><button id="sub">1 · Activar avisos</button></p>
  <label>Texto <textarea id="text" rows="3">anoche hablaba con alguien que no estaba; debe ser el cansancio</textarea></label>
  <label>occurred_hint
    <select id="hint"><option value="">(ninguno)</option><option>ahora</option><option>esta_manana</option>
      <option>esta_tarde</option><option>anoche</option><option>ayer</option></select>
  </label>
  <p><button id="send">2 · Guardar texto (POST /api/entries)</button></p>
  <pre id="log">—</pre>
<script>
const log = (x) => { document.getElementById("log").textContent = typeof x === "string" ? x : JSON.stringify(x, null, 2); };
const b64ToBytes = (s) => { const p = "=".repeat((4 - s.length % 4) % 4);
  const raw = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(raw, (c) => c.charCodeAt(0)); };

document.getElementById("sub").onclick = async () => {
  try {
    if (await Notification.requestPermission() !== "granted") return log("Permiso de notificaciones denegado.");
    const reg = await navigator.serviceWorker.register("/dev/sw.js", { scope: "/dev/" });
    await navigator.serviceWorker.ready;
    const { public_key, error } = await (await fetch("/dev/vapid")).json();
    if (error) return log(error);
    const old = await reg.pushManager.getSubscription();
    if (old) await old.unsubscribe();   // por si cambiaron las claves VAPID
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(public_key) });
    const r = await fetch("/dev/subscribe", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ person_id: Number(document.getElementById("person").value), subscription: sub.toJSON() }) });
    log({ suscripto: r.ok, endpoint: sub.endpoint.slice(0, 60) + "…" });
  } catch (e) { log("Error: " + e); }
};

document.getElementById("send").onclick = async () => {
  const fd = new FormData();
  fd.append("person_id", document.getElementById("person").value);
  fd.append("text", document.getElementById("text").value);
  fd.append("occurred_hint", document.getElementById("hint").value);
  const r = await fetch("/api/entries", { method: "POST", body: fd });
  log({ status: r.status, body: await r.json() });
};
</script>
</body>
</html>
