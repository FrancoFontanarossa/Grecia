{# Fila chica de los inicios para activar avisos: aparece solo si el permiso no está dado. En iPhone fuera de la app
   pide agregarla a la pantalla de inicio. Estado en JS (EC.push.state()); "Ahora no" se recuerda en el teléfono. #}
<div x-data="avisosCard({{ 'true' if dismissible else 'false' }})" x-show="visible" x-cloak class="tarjeta-aviso tarjeta-aviso--fila" role="region" aria-label="Avisos">
  <span class="tarjeta-aviso__tx" x-text="error || shortText"></span>
  <button type="button" class="btn p" x-show="state === 'pendiente'" @click="activar()" :disabled="busy" x-text="busy ? 'Activando…' : 'Activar'"></button>
  <button type="button" class="enlace-suave" x-show="dismissible && state !== 'activo'" @click="cerrar()">Ahora no</button>
</div>
