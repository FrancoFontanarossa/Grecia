<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Entrecasa{% endblock %}</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entrecasa">
<meta name="theme-color" content="#B3CBF0">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{# SF Pro en Apple (la del sistema, sin descarga); Inter solo como respaldo fuera de Apple. #}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/css/tokens.css?v={{ ASSET_VERSION }}">
<link rel="stylesheet" href="/static/css/app.css?v={{ ASSET_VERSION }}">
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
<script>window.ENTRECASA = { demo: {{ 'true' if DEMO_MODE else 'false' }} };</script>
<script src="/static/js/app.js?v={{ ASSET_VERSION }}"></script>
<script src="/static/js/components.js?v={{ ASSET_VERSION }}"></script>
<script src="/static/js/contar.js?v={{ ASSET_VERSION }}"></script>
{% block head %}{% endblock %}
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body hx-boost="true">
{% block content %}{% endblock %}
{% if simulated %}
<div class="rotulo-simulado" role="note">Datos de ejemplo: esta parte todavía no está conectada a la base.</div>
{% endif %}
</body>
</html>
